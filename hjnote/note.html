<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기록해</title>

  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="note-container">
    <div class="note_wrap">
      <ul class="note_list">
        <li class="note_item">
          <div class="item_inner">
            <div class="item-hd">
              <h4 class="item-title">아이디어 관리 페이지</h4>
            </div>
            <div class="item-bd">
              <div class="item-subs">
                <!-- 문단 -->
                <div class="subs_wrap">
                  <ul class="list">
                    <li class="item strong">이 페이지는 아이디어를 정리 및 관리를 목적으로 만들어진 페이지입니다.</li>
                    <li class="item">기록된 아이디어의 잊혀짐을 방지하는 것이 주목적입니다.</li>
                    <li class="item">페이지 형태로 관리하면서 웹과 멀어짐을 방지하기 위한 목적 또한 존재합니다.</li>
                    <li class="item txt--r strong">다만 본 페이지는 테스트 페이지입니다.</li>
                    <li class="item">상위 페이지들과는 개별적으로 운영 및 관리됩니다.</li>
                    <li class="item">디자인 및 기능적 옵션을 상위페이지와 분리하여 관리합니다.</li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </li>
      </ul>
    </div>
  </div>
</body>
</html>
